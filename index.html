<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Air Zone Automobile | Premium Car Care & Auto Services</title>
    <meta
      name="description"
      content="Experience premium car care at Air Zone Automobile. Explore professional car servicing, maintenance, diagnostics, detailing, and repair solutions for your vehicle."
    />
    <meta
      name="keywords"
      content="Air Zone Automobile, car service, automobile service center, car repair, car maintenance, car diagnostics, OBD scanning, car detailing, premium car care"
    />
    <meta name="author" content="Air Zone Automobile" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#aeacad" />
    <meta name="color-scheme" content="dark light" />

    <!-- Canonical URL: replace with your real domain -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Air Zone Automobile" />
    <meta
      property="og:title"
      content="Air Zone Automobile | Premium Car Care"
    />
    <meta
      property="og:description"
      content="Discover premium car servicing, diagnostics, maintenance, and detailing at Air Zone Automobile."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta
      property="og:image"
      content="https://yourdomain.com/images/og-cover.jpg"
    />
    <meta
      property="og:image:alt"
      content="Air Zone Automobile premium car care and automotive services"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Air Zone Automobile | Premium Car Care"
    />
    <meta
      name="twitter:description"
      content="Professional automotive care, car diagnostics, servicing, and maintenance at Air Zone Automobile."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/images/og-cover.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Air Zone Automobile premium automotive care"
    />

    <!-- Performance: Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SPA fallback / indexing support is configured on the server -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
